server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketflow_event_db
    username: postgres  
    password: mama
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh